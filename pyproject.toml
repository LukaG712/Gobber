[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gobber"
version = "1.0.0"
description = "Persistent storage service for the Evershade ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "LukaG712"},
]
keywords = ["storage", "webhooks", "analytics", "cache", "feature-flags"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "aiofiles==24.1.0",
    "aiohttp==3.9.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus_client>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/LukaG712/Gobber"
Repository = "https://github.com/LukaG712/Gobber"

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-timeout==2.3.1",
    "ruff==0.9.0",
]

[tool.setuptools.packages.find]
include = ["gobber*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
timeout_func_only = true
